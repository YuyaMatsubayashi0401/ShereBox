<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShereBox - ログイン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container { max-width: 400px; margin-top: 100px; }
        .user-btn { margin-bottom: 10px; height: 60px; font-size: 1.2rem; }
    </style>
</head>
<body class="bg-light">

    <div class="container login-container text-center">
        <h1 class="mb-4">ShereBox</h1>
        <p class="text-muted">あなたのお名前を選んでください</p>
        
        <form th:action="@{/login}" method="post" class="d-grid gap-2">
            <button type="submit" name="userName" value="はらみ" class="btn btn-outline-primary user-btn">はらみ</button>
            <button type="submit" name="userName" value="ぽんずおいしー" class="btn btn-outline-success user-btn">ぽんずおいしー</button>
            <button type="submit" name="userName" value="Klin" class="btn btn-outline-danger user-btn">Klin</button>
            <button type="submit" name="userName" value="わたぬき" class="btn btn-outline-warning user-btn">わたぬき</button>
        </form>
        
        <p class="mt-5 small text-secondary">&copy; 2026 ShereBox Team</p>
    </div>

</body>
</html>

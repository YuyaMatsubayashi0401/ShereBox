<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShereBox - マイページ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div th:replace="~{common/header :: layout-header}"></div>

    <div class="container mt-3">
        <h4>自分が借りているもの</h4>
        <p class="small text-muted" th:text="${session.userName} + ' さんのマイページ'"></p>

        <form th:action="@{/lending/return}" method="post">
            <div th:each="lending : ${myLendings}" class="card mb-2 shadow-sm">
                <div class="card-body p-3">
                    <div class="d-flex align-items-center">
                        <div class="form-check me-3">
                            <input class="form-check-input" type="checkbox" name="lendingIds" th:value="${lending.id}" style="width: 25px; height: 25px;">
                        </div>
                        <div class="flex-grow-1">
                            <div class="fw-bold" th:text="${lending.item.name}">アイテム名</div>
                            <div class="small text-muted">
                                借りている数: <span th:text="${lending.borrowedCount}">0</span>個 / 
                                所有者: <span th:text="${lending.item.ownerName}">所有者</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sticky-bottom bg-white p-3 border-top mt-4 shadow-lg mx-n3">
                <button type="submit" class="btn btn-warning w-100 btn-lg">選択したものを返す</button>
            </div>
        </form>
        
        <div th:if="${#lists.isEmpty(myLendings)}" class="text-center mt-5">
            <i class="bi bi-emoji-smile" style="font-size: 3rem; color: #ccc;"></i>
            <p class="text-muted mt-2">現在借りているものはありません。</p>
            <a th:href="@{/inventory}" class="btn btn-primary">借りに行く</a>
        </div>
    </div>

</body>
</html>

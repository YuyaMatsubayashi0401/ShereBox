<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShereBox - 一括登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{common/header :: layout-header}"></div>
    <div class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">在庫を一括登録する</h5>
                <form th:action="@{/inventory/add}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">1. カテゴリを選択</label>
                        <select name="category" class="form-select" required>
                            <option value="" disabled selected>選択してください</option>
                            <option value="たねポケモン">たねポケモン</option>
                            <option value="1進化ポケモン">1進化ポケモン</option>
                            <option value="2進化ポケモン">2進化ポケモン</option>
                            <option value="サポート">サポート</option>
                            <option value="グッズ">グッズ</option>
                            <option value="ポケモンのどうぐ">ポケモンのどうぐ</option>
                            <option value="スタジアム">スタジアム</option>
                            <option value="基本エネルギー">基本エネルギー</option>
                            <option value="特殊エネルギー">特殊エネルギー</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">2. アイテムを入力 (名前/個数)</label>
                        <textarea name="rawData" class="form-control" rows="10" placeholder="例：&#10;ピカチュウ/4&#10;ネストボール,2&#10;(分割には,、・/:;：；対応)"></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">登録する</button>
                        <a th:href="@{/inventory}" class="btn btn-outline-secondary">戻る</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
